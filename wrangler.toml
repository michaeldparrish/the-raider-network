# The Raider Network — Cloudflare Pages configuration (v6.0)
# See docs/CLOUDFLARE-BACKEND-SETUP.md for the full step-by-step guide.
#
# This file is used by `wrangler pages dev` (local) and `wrangler d1 ...` commands, and Cloudflare Pages reads
# its bindings when the site is deployed from GitHub.
name = "the-raider-network"
pages_build_output_dir = "."
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"                                   # the code reads env.DB — do not rename
database_name = "raider-network-db"
database_id = "dfdc5167-c168-4dd0-bacc-bffa252447e1" # from: npx wrangler d1 create raider-network-db
migrations_dir = "migrations"

# v6.3 Loot Trails — private screenshot storage
[[r2_buckets]]
binding = "TRAIL_IMAGES"
bucket_name = "raider-network-trail-images"
